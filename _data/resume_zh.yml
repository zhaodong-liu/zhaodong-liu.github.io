research:
  - name: "科研助理，上海纽约大学，中国上海"
    location: "上海，中国"
    position: "科研助理"
    startDate: "2025-05-01"
    endDate: "2026-01-31"
    summary: "多模态推荐系统的生成式检索"
    highlights:
      - "导师：文弘毅教授"
      - "开发了基于 Amazon 数据集的序列推荐多模态框架。识别并应用 VQ-VAE、RQ-VAE、OPQ 来捕捉离散行为模式，在 NDCG@10 指标上实现了 47.2% 的提升（从 0.0339 提升至 0.0499）。"
      - "与 2 名队友合作，实现了受 BPE 启发的分区分词技术，跨物品序列合并频繁子序列，以增强上下文连贯性与表示质量。"

  - name: "科研助理，上海纽约大学，中国上海"
    location: "上海，中国"
    position: "科研助理"
    startDate: "2024-05-01"
    endDate: "2024-08-01"
    summary: "考虑交通信号灯时长的高效驾驶路线优化"
    highlights:
      - "导师：陈志斌教授"
      - "提出并设计了真实地图约束下的交通感知路由系统，最小化能源消耗。"
      - "构建了 OSM、SUMO、TraCI 流程，并扩展 Dijkstra 算法至多目标（时间、能源）最短路径，整合了电动车和汽油车的能源模型。实现了 10-15% 的燃油节省，时间成本增加 2-5%。"

projects:
  - name: "纽约大学数据科学中心"
    location: "纽约市，美国"
    startDate: "2024-09-15"
    endDate: "2024-12-15"
    summary: "微调预训练语言模型实现高效化学逆合成"
    highlights:
      - "利用 SMILES 标记法训练化学反应逆合成预测模型，应用大语言模型（LlaSMol-Llama2）对数据集进行重建和扩充，使 Top-1 准确率提高了 26.2%（从 0.588 提升至 0.742）。"
      - "探索并采用了多种微调策略（Encoder 参数冻结、MLP 适配器、LoRA），以确定准确率与效率权衡最优的方法。"

  - name: "纽约大学坦顿工程学院"
    location: "布鲁克林，纽约州，美国"
    startDate: "2024-09-01"
    endDate: "2024-12-15"
    summary: "虚拟体育联赛数据库"
    highlights:
      - "自主设计了一个包含 13 张数据表的 MySQL 数据库，录入 390 余条记录，支持多联赛虚拟体育运营，涵盖用户认证、选秀调度、阵容管理与交易系统；以 Python 构建后端、HTML/CSS 构建前端，实现符合 ACID 规范的事务、触发器与存储过程，完成全栈功能集成。"

work:
  - name: "麦当劳中国 数据战略部"
    location: "上海，中国"
    position: "数据工程师实习"
    startDate: "2025-12-18"
    endDate: "2026-04-02"
    summary: "为麦当劳中国的商业智能与数据分析构建并优化数据基础设施。"
    highlights:
      - "牵头开发了内部 AI 智能体用于自助数据访问，将自然语言查询路由到覆盖 14 个业务领域的约束感知 SQL，或通过 RAG（检索增强生成）在内部数据地图和文档上生成带引用的答案。"
      - "发起并设计了基于相似度的销售预测算法，在跨越 4 个 ID 层级标准化的组合主数据集上进行操作，量化菜单构成以预测新组合套餐的上市销售额。"
      - "管理和验证企业数据库模式和数据地图，管理包含 203 个场景/54 个接口的数据地图。"
      - "重新设计数据仪表板，组织 500+ 财务指标，构建结构化下钻路径以实现自助分析。"

